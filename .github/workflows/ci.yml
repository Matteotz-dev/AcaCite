name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: |
          python -m compileall -q app cli scripts tests server.py shared_memory.py smoke_test.py

      - name: Public tree audit
        run: |
          python scripts/check_public_tree.py

      - name: Unit tests
        run: |
          pytest -q tests/unit
