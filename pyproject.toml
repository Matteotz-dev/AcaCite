[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acacite"
version = "0.1.0"
description = "Local citation-oriented research memory with HTTP and retrieval-only MCP surfaces."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "AcaCite contributors" }
]
keywords = ["rag", "mcp", "research", "citations", "retrieval", "qdrant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "cognee[fastembed]>=1.4,<1.5",
  "qdrant-client>=1.18,<2",
  "sentence-transformers>=5,<6",
  "docling>=2.80,<3",
  "fastapi>=0.139,<1",
  "pydantic-settings>=2.14,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn>=0.51,<1",
  "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
acacite = "cli.rag:main"
acacite-expand-citations = "scripts.expand_citations:main"
acacite-mcp = "app.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Matteotz-dev/AcaCite"
Repository = "https://github.com/Matteotz-dev/AcaCite"

[tool.setuptools]
packages = ["app", "app.db", "app.evaluation", "app.generation", "app.ingestion", "app.mcp", "app.retrieval", "cli", "scripts"]
py-modules = ["server", "shared_memory", "smoke_test"]
include-package-data = true

[tool.setuptools.package-data]
"app.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
